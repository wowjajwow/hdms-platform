<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="leftTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1262ff"/>
      <stop offset="100%" stop-color="#0b45d8"/>
    </linearGradient>
    <linearGradient id="leftBottom" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b47d9"/>
      <stop offset="100%" stop-color="#082f9f"/>
    </linearGradient>
    <linearGradient id="bridge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0a51ea"/>
      <stop offset="100%" stop-color="#073ab3"/>
    </linearGradient>
    <linearGradient id="rightTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f5cf5"/>
      <stop offset="100%" stop-color="#0a43cd"/>
    </linearGradient>
    <linearGradient id="rightBottom" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b59f3"/>
      <stop offset="100%" stop-color="#20c9ff"/>
    </linearGradient>
  </defs>

  <!-- Continuous silhouette keeps every internal seam opaque at any scale. -->
