  <!-- Left lower pillar -->
  <polygon points="0,61.5 30.5,36.4 30.5,100 0,100" fill="url(#leftBottom)"/>

  <!-- Right upper pillar -->
  <polygon points="69.7,0 100,0 100,36.4 69.7,36.4" fill="url(#rightTop)"/>

  <!-- Right lower pillar -->
