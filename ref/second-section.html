<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HDMS - Integrated Infrastructure Section</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter & Noto Sans KR -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'Noto Sans KR', 'sans-serif'],
                    },
                    colors: {
                        hdms: {
                            blue: '#0d52ce',
                            darkblue: '#0a3a99',
                            cyan: '#0284c7',
                            lightbg: '#f8fafc',
                            grid: 'rgba(219, 234, 254, 0.6)',
                        }
                    },
                    animation: {
                        'pulse-glow': 'pulseGlow 5s ease-in-out infinite',
                    },
                    keyframes: {
                        pulseGlow: {
                            '0%, 100%': { opacity: '0.35', transform: 'scale(1)' },
                            '50%': { opacity: '0.75', transform: 'scale(1.08)' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: 'Inter', 'Noto Sans KR', sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
            overflow-x: hidden;
        }

        /* HDMS Signature Light Blue Grid Background */
        .hdms-grid-bg {
            background-image: 
                linear-gradient(to right, rgba(147, 197, 253, 0.22) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(147, 197, 253, 0.22) 1px, transparent 1px);
            background-size: 48px 48px;
        }

        /* Gradient text effect */
        .text-gradient-accent {
            background: linear-gradient(135deg, #0d52ce 0%, #2563eb 50%, #06b6d4 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-center items-center hdms-grid-bg antialiased selection:bg-blue-600 selection:text-white relative overflow-hidden">

    <!-- MAIN HERO SECTION -->
    <main class="relative w-full min-h-screen flex flex-col items-center justify-center px-6 py-12 text-center select-none">

        <!-- Dynamic Galactic Milky Way Canvas Container -->
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[950px] h-[950px] sm:w-[1350px] sm:h-[1350px] md:w-[1750px] md:h-[1750px] pointer-events-none z-0">
            <canvas id="galaxyCanvas" class="w-full h-full"></canvas>
        </div>

        <!-- CENTER CONTENT CONTAINER -->
        <div class="relative z-10 max-w-3xl mx-auto flex flex-col items-center justify-center space-y-6 sm:space-y-8">
            
            <!-- 01. TOP SUBTITLE (Mono Badge) -->
            <div class="inline-flex items-center space-x-3 text-xs sm:text-sm font-mono font-medium text-blue-600 tracking-[0.25em] uppercase">
                <span class="w-8 h-[1px] bg-blue-300 inline-block"></span>
                <span>02 — INTEGRATED INFRASTRUCTURE</span>
                <span class="w-8 h-[1px] bg-blue-300 inline-block"></span>
            </div>

            <!-- 02. MAIN HEADLINE -->
            <h1 class="text-4xl sm:text-6xl md:text-7xl font-extrabold text-slate-900 tracking-tight leading-[1.1] font-sans">
                One Heritage.<br />
                <span class="text-gradient-accent">Integrated Infrastructure.</span>
            </h1>

            <!-- 03. MAIN BODY TEXT (User Provided Text Only) -->
            <p class="text-base sm:text-lg md:text-xl text-slate-600 font-normal leading-relaxed md:leading-relaxed max-w-2xl mx-auto tracking-normal font-sans">
                변압기 한 대의 품질이 전체 전력설비의 안정성을 좌우하듯,<br class="hidden sm:inline" /> 
                데이터센터의 안정성 역시 전력과 냉각 인프라에 대한 깊은 이해에서 시작됩니다.<br class="hidden sm:inline" /> 
                <span class="text-slate-900 font-semibold">HDMS</span>는 <span class="text-blue-700 font-semibold">50년 이상 축적된 전력설비 기술</span>을 기반으로 변압기, ESS, 냉각 시스템, 통합연구개발을 통해 <strong class="text-blue-600 font-bold">AI 토탈 전력 인프라 솔루션</strong>을 제공합니다.
            </p>

        </div>

    </main>

    <script>
        const canvas = document.getElementById('galaxyCanvas');
        const ctx = canvas.getContext('2d');

        let width, height, centerX, centerY;
        let particles = [];
        const particleCount = 7500; // Expanded galaxy star density
        let mouse = { x: null, y: null, active: false };

        function resizeCanvas() {
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width * window.devicePixelRatio;
            canvas.height = rect.height * window.devicePixelRatio;
            width = canvas.width;
            height = canvas.height;
            centerX = width / 2;
            centerY = height / 2;

            initParticles();
        }

        class GalaxyParticle {
            constructor() {
                this.reset();
            }

            reset() {
                const maxRadius = Math.min(width, height) * 0.49;
                // Push minRadius outward so particles orbit strictly outside the central text box
                const minRadius = Math.min(width, height) * 0.27;

                // 82% of particles belong to main spiral arms, 18% scattered galactic dust halo
                this.isArm = Math.random() < 0.82;
                
                // Radius distribution concentrated around the outer ring
                const randR = Math.pow(Math.random(), 1.2); 
                this.baseRadius = minRadius + randR * (maxRadius - minRadius);
                this.radius = this.baseRadius;

                // 2 major spiral arms creating authentic Milky Way curvature
                const arms = 2; 
                this.armIndex = Math.floor(Math.random() * arms);
                const armBaseAngle = (this.armIndex * Math.PI * 2) / arms;
                
                // Logarithmic spiral angle offset
                const spiralTightness = 0.0075;
                const spiralAngle = this.baseRadius * spiralTightness;
                
                // Perpendicular scatter from spiral arm line
                const armScatter = (Math.random() - 0.5) * (0.35 + (this.baseRadius / maxRadius) * 0.55);
                
                if (this.isArm) {
                    this.angle = armBaseAngle + spiralAngle + armScatter;
                } else {
                    this.angle = Math.random() * Math.PI * 2;
                }

                // Orbital velocity - differential galaxy rotation curve
                this.speed = (0.00035 + (1 - this.baseRadius / maxRadius) * 0.00075) * (Math.random() * 0.3 + 0.85);
                
                // Size: micro cosmic dust (0.4~1.2px) with occasional twinkling stars (1.8~2.8px)
                const isBrightStar = Math.random() < 0.06;
                this.size = isBrightStar ? (Math.random() * 1.2 + 1.6) : (Math.random() * 0.8 + 0.4);
                
                // Twinkle & Pulsing phase
                this.baseAlpha = Math.random() * 0.55 + 0.18;
                this.alpha = this.baseAlpha;
                this.twinkleSpeed = Math.random() * 0.025 + 0.008;
                this.twinklePhase = Math.random() * Math.PI * 2;

                // Dark & Deep Cosmic Palette for Light Background
                const colors = [
                    '#0f172a', // Dark Slate
                    '#0a2540', // Midnight Navy
                    '#1e1b4b', // Deep Cosmic Indigo
                    '#091e3a', // Deep Sapphire Black
                    '#1e293b', // Deep Charcoal Blue
                    '#031b4e', // Deep HDMS Royal Dark Blue
                    '#334155'  // Steel Slate Dust
                ];
                this.color = colors[Math.floor(Math.random() * colors.length)];
            }

            update() {
                this.angle += this.speed;
                this.twinklePhase += this.twinkleSpeed;
                this.alpha = Math.max(0.12, Math.min(0.85, this.baseAlpha + Math.sin(this.twinklePhase) * 0.22));

                // 3D perspective tilt (elliptical galaxy view)
                const tilt = 0.65;

                // Interactive gravitational distortion on mouse move
                if (mouse.active) {
                    const px = centerX + Math.cos(this.angle) * this.radius;
                    const py = centerY + Math.sin(this.angle) * this.radius * tilt;

                    const dx = mouse.x - px;
                    const dy = mouse.y - py;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < 180) {
                        this.radius += (180 - dist) * 0.02;
                    } else {
                        this.radius += (this.baseRadius - this.radius) * 0.02;
                    }
                } else {
                    this.radius += (this.baseRadius - this.radius) * 0.02;
                }
            }

            draw() {
                const tilt = 0.65; // Galaxy disk tilt ratio
                const x = centerX + Math.cos(this.angle) * this.radius;
                const y = centerY + Math.sin(this.angle) * this.radius * tilt;

                ctx.save();
                ctx.fillStyle = this.color;
                ctx.globalAlpha = this.alpha;

                // Subtle glowing aura for brighter stars
                if (this.size > 1.5) {
                    ctx.shadowColor = this.color;
                    ctx.shadowBlur = 5;
                }

                ctx.beginPath();
                ctx.arc(x, y, this.size, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }
        }

        function initParticles() {
            particles = [];
            for (let i = 0; i < particleCount; i++) {
                particles.push(new GalaxyParticle());
            }
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);

            particles.forEach(p => {
                p.update();
                p.draw();
            });

            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', resizeCanvas);
        
        window.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            mouse.x = (e.clientX - rect.left) * window.devicePixelRatio;
            mouse.y = (e.clientY - rect.top) * window.devicePixelRatio;
            mouse.active = true;
        });

        window.addEventListener('mouseleave', () => {
            mouse.active = false;
        });

        window.onload = function() {
            resizeCanvas();
            animate();
        };
    </script>
</body>
</html>
